<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-title">
        <h1>My Bookshop</h1>
      </header>
      <nav class="navbar">
        <div class="nav-toggle" id="nav-toggle">☰</div>
        <ul class="nav-links" id="nav-links">
            <li><a href="#">About Us</a></li>
            <li><a href="index.html">Home</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </nav>
      
      

      <section class="page-heading">
        <h2>Enter Payment Details</h2>
      </section>
      
  <form id="payment-form">
    <label for="card-number">Credit Card Number:</label><br>
    <input type="text" id="card-number" required><br><br>

    <label for="exp-month">Expiration Month:</label><br>
<input list="months" id="exp-month" required>
<datalist id="months">
  <option value="1">
  <option value="2">
  <option value="3">
  <option value="4">
  <option value="5">
  <option value="6">
  <option value="7">
  <option value="8">
  <option value="9">
  <option value="10">
  <option value="11">
  <option value="12">
</datalist><br><br>



<label for="exp-year">Expiration Year:</label><br>
<input list="years" id="exp-year" required>
<datalist id="years">
  <option value="2025">
  <option value="2026">
  <option value="2027">
  <option value="2028">
  <option value="2029">
  <option value="2030">

</datalist><br><br>


    <label for="cvv">CVV Code:</label><br>
    <input type="text" id="cvv" required><br><br>

    <button type="submit">Continue</button>
  

  <div id="message"></div>
</form>
  <script src="js/pay.js" defer></script>
</body>
</html>
